name: CI

# Spec 08 §8 — every commit runs all blocking gate steps, in order.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 1. prettier --check
      - name: Format check
        run: bun run format:check

      # 2. eslint --max-warnings 0  (+ grep gate)
      - name: Lint
        run: bun run lint
      - name: Grep gate (no ignore/disable/focus comments)
        run: bun run lint:grep

      # 3. tsc --noEmit
      - name: Typecheck
        run: bun run typecheck

      # 4. vitest run (unit, coverage thresholds 100/100/100/100)
      - name: Unit tests + coverage
        run: bun run test

      # 5. vitest run @envtest (integration, real API server) — wired in Chunk 0.3
      - name: Integration tests (envtest)
        run: bun run test:envtest
        if: ${{ hashFiles('test/envtest/**') != '' }}

      # 6. cucumber-js (behavior suite)
      - name: Behavior tests (BDD)
        run: bun run bdd

  # Nightly / on-demand, non-blocking (Spec 08 §8 steps 7-8) — wired in later chunks.
  nightly:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Model evals (non-gating)
        run: bun run eval || true
