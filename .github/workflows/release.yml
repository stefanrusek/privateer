name: Release

# Tag a version (v0.1.0) to build and publish single binaries for every
# supported platform. Bun cross-compiles all targets from one Linux host;
# onnxruntime-node ships every platform's native library in the package, and
# scripts/build.ts embeds the right one per target.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all targets
        run: bun run build:all

      - name: Smoke test (host binary)
        run: |
          ./dist/p9r version
          ./dist/p9r help > /dev/null

      - name: Package artifacts
        run: |
          cd dist
          mv p9r p9r-linux-x64 2>/dev/null || true
          for f in p9r-*; do
            case "$f" in
              *windows*) zip "${f%.exe}.zip" "$f" ;;
              *) tar czf "$f.tar.gz" "$f" ;;
            esac
          done
          ls -lh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "p9r $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip
