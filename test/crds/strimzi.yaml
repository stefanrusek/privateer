# Minimal Strimzi (kafka.strimzi.io) CRDs for envtest — enough to exercise CRD
# discovery, sidebar grouping, and the Kafka/KafkaTopic status resolvers against
# a real API server. Not the full upstream schema.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkas.kafka.strimzi.io
spec:
  group: kafka.strimzi.io
  scope: Namespaced
  names:
    plural: kafkas
    singular: kafka
    kind: Kafka
    listKind: KafkaList
  versions:
    - name: v1beta2
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkatopics.kafka.strimzi.io
spec:
  group: kafka.strimzi.io
  scope: Namespaced
  names:
    plural: kafkatopics
    singular: kafkatopic
    kind: KafkaTopic
    listKind: KafkaTopicList
  versions:
    - name: v1beta2
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
